# Tiếng Việt: Workflow CI tự kiểm tra quy tắc PosUi cho mỗi PR.
#   Chỉ kiểm tra ESLint/custom rules trên các file thay đổi (changed files only).
#   File mới hoặc file bị chỉnh trong PR sẽ bị chặn 100%; vi phạm cũ tích lũy
#   ở file khác sẽ được dọn dần khi tác giả chạm tới (theo CLAUDE.md).
# 한국어: PR 단위 PosUi 규칙 자동 검증.
#   ESLint/custom rules 는 PR 의 변경된 파일만 검사. 신규/만진 파일은 100% 차단.
name: PosUi Rules

on:
  pull_request:
    branches: [main]
    paths:
      - 'BrandPosApp/PosUi/**'
      - 'scripts/check-posui-rules.sh'
      - '.github/workflows/posui-rules.yml'

jobs:
  rules:
    name: Lint / Type / Custom rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: BrandPosApp/PosUi
        run: npm install --no-audit --no-fund

      - name: Compute changed files in PR
        id: changed
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          git fetch origin "$BASE" --depth=1 || true
          CHANGED=$(git diff --name-only --diff-filter=ACMRT "$BASE" "$HEAD" \
            | grep -E '^BrandPosApp/PosUi/src/.*\.(ts|tsx)$' || true)
          {
            echo "files<<EOF"
            echo "$CHANGED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -z "$CHANGED" ]; then
            echo "no-changed-files=true" >> "$GITHUB_OUTPUT"
          else
            echo "no-changed-files=false" >> "$GITHUB_OUTPUT"
          fi

      - name: TypeScript check (full project)
        working-directory: BrandPosApp/PosUi
        run: npx tsc --noEmit

      - name: ESLint (changed files only)
        if: steps.changed.outputs.no-changed-files == 'false'
        working-directory: BrandPosApp/PosUi
        run: |
          FILES=$(echo "${{ steps.changed.outputs.files }}" | sed 's|^BrandPosApp/PosUi/||')
          echo "Linting:"
          echo "$FILES"
          echo "$FILES" | xargs npx eslint --max-warnings=0

      - name: Custom PosUi rules (changed files only)
        if: steps.changed.outputs.no-changed-files == 'false'
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: bash scripts/check-posui-rules.sh
